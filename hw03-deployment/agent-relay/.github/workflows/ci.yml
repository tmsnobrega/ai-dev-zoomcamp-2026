name: Agent Relay CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Create the scratch database folder
        run: python -c "from pathlib import Path; Path('.tmp').mkdir(exist_ok=True)"
      - name: Run SQLite unit tests
        env:
          RELAY_DATABASE_URL: sqlite:///./.tmp/agent-relay-unit.db
        run: uv run --frozen pytest -q test_agent_relay.py
      - name: Run PostgreSQL HTTP integration test
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from integration integration
      - name: Stop test services
        if: always()
        run: docker compose --profile test down

  deploy-to-kind:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1.10.0
        if: ${{ !env.ACT }}
        with:
          cluster_name: agent-relay
      - name: Build and load the tested application image
        run: |
          docker build -t agent-relay:${GITHUB_SHA} .
          kind load docker-image agent-relay:${GITHUB_SHA} --name agent-relay
      - name: Create local cluster credentials
        run: |
          kubectl create secret generic relay-secrets --dry-run=client -o yaml \
            --from-literal=postgres-password=kind-only-password \
            --from-literal=enrollment-secret=kind-only-enrollment \
            --from-literal=database-url='postgresql+psycopg://relay:kind-only-password@postgres:5432/relay' \
            | kubectl apply -f -
      - name: Deploy database and application after tests pass
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres --timeout=180s
          sed "s/\${IMAGE_TAG}/${GITHUB_SHA}/g" k8s/agent-relay.yaml | kubectl apply -f -
          kubectl rollout status deployment/agent-relay --timeout=180s
      - name: Smoke-test the deployed service
        run: |
          kubectl port-forward service/agent-relay 18000:8000 >/tmp/agent-relay-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/ready | grep -q '"status":"ready"'; then
              curl --fail --silent http://127.0.0.1:18000/ | grep -q 'Agent Relay v2'
              exit $?
            fi
            sleep 2
          done
          cat /tmp/agent-relay-port-forward.log
          exit 1
