<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{% block title %}Household Chores{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0 auto; max-width: 900px; padding: 1rem; color: #202124; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
    nav a { color: #075ea8; }
    section { border-top: 1px solid #ddd; margin-top: 2rem; }
    li { margin-bottom: .75rem; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, select, textarea { box-sizing: border-box; max-width: 32rem; padding: .5rem; width: 100%; }
    button { margin-top: .5rem; padding: .5rem .8rem; }
    .message { background: #eaf7ea; padding: .75rem; }
    .errors, .errorlist { color: #a40000; }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'members' %}">Members</a>
    <a href="{% url 'add_chore' %}">Add chore</a>
  </nav>

  {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
